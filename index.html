<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candlestick Pattern Quiz</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        padding: 20px;
      }
      .quiz-container {
        max-width: 700px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .quiz-item {
        margin-bottom: 40px;
      }
      .quiz-item img {
        width: 100%;
        max-height: 300px;
        object-fit: contain;
        margin-bottom: 15px;
      }
      .options button {
        display: block;
        margin: 5px 0;
        padding: 10px;
        width: 100%;
        background: #e0e0e0;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
      }
      .options button:hover {
        background: #d5d5d5;
      }
      .explanation {
        display: none;
        margin-top: 15px;
        background: #e8f5e9;
        border-left: 5px solid #4caf50;
        padding: 10px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="quiz-container" id="quiz"></div>

    <script>
      const quizData = [
        {
          image:
            "https://img001.prntscr.com/file/img001/Aw9AgUX8QKil-BUdnw7ScQ.png",
          correct: "Engulfing Bar",
          options: ["Doji", "Hammer", "Engulfing Bar", "Shooting Star"],
          explanation:
            "The Engulfing Bar pattern indicates a strong reversal signal where the second candle completely engulfs the previous one. Bullish engulfing appears after a downtrend; bearish after an uptrend.",
        },
        {
          image:
            "https://img001.prntscr.com/file/img001/rfXpIkN6RSegXlV7BWD-Xg.png",
          correct: "Doji",
          options: ["Doji", "Harami", "Morning Star", "Gravestone Doji"],
          explanation:
            "Doji is one of the most important Japanese candlestick patterns, when this candlestick forms, it tells us that the market opens and closes at the same price which means that there is equality and indecision between buyers and sellers, there is no one in control of the market. ",
        },
        {
          image:
            "https://img001.prntscr.com/file/img001/iIhdfuXkSemI-o5IadOQtg.png",
          correct: "Dragonfly Doji",
          options: [
            "Gravestone Doji",
            "Dragonfly Doji",
            "Hammer",
            "Shooting Star",
          ],
          explanation:
            "The Dragonfly Doji is a bullish candlestick pattern which is formed when the open high and close are the same or about the same price.  What characterizes the dragonfly Doji is the long lower tail that shows the resistance of buyers and their attempt to push the market up. ",
        },
        {
          image:
            "https://img001.prntscr.com/file/img001/YCx3ExlETYKBEpNwtMQn_w.png",
          correct: "Gravestone Doji",
          options: [
            "Gravestone Doji",
            "Dragonfly Doji",
            "Shooting Star",
            "Doji",
          ],
          explanation:
            "The Gravestone Doji is the bearish version of the dragonfly Doji, it is formed when the open and close are the same or about the same price.  What differentiates the Gravestone Doji from the dragonfly Doji is the long upper tail.  The formation of the long upper tail is an indication that the market is testing a powerful supply or resistance area.  ",
        },
        {
          image:
            "https://img001.prntscr.com/file/img001/ZBdxQ9LpSn6VDIug1LX2ow.png",
          correct: "Morning Star",
          options: ["Evening Star", "Morning Star", "Harami", "Hammer"],
          explanation:
            "The morning star pattern is considered as a bullish reversal pattern, it often occurs at the bottom of a downtrend and it consists of three candlesticks:<br><br> -The first candlestick is bearish which indicates that sellers are still in charge of the market.<br><br> -The second candle is a small one which represents that sellers are in control, but they don’t push the market much lower and this candle can be bullish or bearish.<br><br> -The third candle is a bullish candlestick that gapped up on the open and closed above the midpoint of the body of the first day, this candlestick holds a significant trend reversal signal. <br><br>The morning star pattern shows us how buyers took control of the market from sellers, when this pattern occurs at the bottom of downtrend near a support level, it is interpreted as a powerful trend reversal signal.   ",
        },
        {
          image:
            "https://img001.prntscr.com/file/img001/faPsXvCdSIO_Q3RV8Yi0Iw.png",
          correct: "Evening Star",
          options: ["Evening Star", "Morning Star", "Harami", "Shooting Star"],
          explanation:
            "The evening star pattern is considered as a bearish reversal pattern that usually occurs at the top of an uptrend.  The pattern consists of three candlesticks:<br><br> -The first candle is a bullish candle<br><br>  -The second candle is a small candlestick, it can be bullish or bearish or it can be a Doji or any other candlestick.<br><br> -The third candle is a large bearish candle. In general, the evening star pattern is the bearish version of the morning star pattern. ",
        },
        {
          image:
            "https://img001.prntscr.com/file/img001/021lZChhQSq8L5prFDbjMQ.png",
          correct: "Hammer",
          options: ["Shooting Star", "Doji", "Hammer", "Harami"],
          explanation:
            "The Hammer candlestick is created when the open high and close are roughly the same price; it is also characterized by a long lower shadow that indicates a bullish rejection from buyers and their intention to push the market higher.  The hammer is a reversal candlestick pattern when it occurs at the bottom of a downtrend. This candle forms when sellers push the market lower after the open, but they get rejected by buyers so the market closes higher than the lowest price. ",
        },
        {
          image:
            "https://img001.prntscr.com/file/img001/2XfxxZfRRk6E3S2rJT6thA.png",
          correct: "Shooting Star",
          options: ["Shooting Star", "Hammer", "Gravestone Doji", "Doji"],
          explanation:
            "The shooting formation is formed when the open low, and close are roughly the same price, this candle is characterized by a small body and a long upper shadow. It is the bearish version of the hammer. Professional technicians say that the shadow should be twice the length of the real body. <br><br>When this candlestick forms near a resistance level. It should be taken as a high probability setup.   ",
        },
        {
          image:
            "https://img001.prntscr.com/file/img001/uFcvvXK3S0WOHOmP1N44sg.png",
          correct: "Harami",
          options: ["Engulfing Bar", "Harami", "Doji", "Morning Star"],
          explanation:
            "The Harami pattern (pregnant in Japanese) is considered as a reversal and continuation pattern, and it consists of two candlesticks:  The first candle is the large candle, it is called the mother candle, followed by a smaller candle which is called the baby. <br><br>For the Harami pattern to be valid, the second candle should close outside the previous one. <br><br> This candlestick is considered as a bearish reversal signal when it occurs at the top of an uptrend, and it is a bullish signal when it occurs at the bottom of a downtrend. ",
        },
        {
          image:
            "https://img001.prntscr.com/file/img001/hYT34DRRTJCekM20ZB_lkw.png",
          correct: "Tweezers Tops and Bottoms",
          options: [
            "Harami",
            "Doji",
            "Tweezers Tops and Bottoms",
            "Morning Star",
          ],
          explanation:
            "The tweezers top formation is considered as a bearish reversal pattern seen at the top of an uptrend, and the tweezers bottom formation is interpreted as a bullish reversal pattern seen at the bottom of a downtrend. <br><br>The tweezers top formation consists of two candlesticks: <br><br> The first one is a bullish candlestick followed by a bearish candlestick. And the tweezers bottom formation consists of two candlesticks as well. <br><br> The first candle is bearish followed by a bullish candlestick.<br><br>  So we can say that the tweezers bottom is the bullish version of the tweezers top. The tweezers top occurs during an uptrend when buyers push the price higher, this gave us the impression that the market is still going up, but sellers surprised buyers by pushing the market lower and close down the open of the bullish candle. <br><br> This price action pattern indicates a bullish trend reversal and we can trade it if we can combine this signal with other technical tools. <br><br> The tweezers bottom happens during a downtrend, when sellers push the market lower, we feel that everything is going all right, but the next session price closes above or roughly at the same price of the first   ",
        },
      ];

      const quizContainer = document.getElementById("quiz");

      quizData.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "quiz-item";
        div.innerHTML = `
        <img src="${item.image}" alt="Candlestick Pattern">
        <div class="options">
          ${item.options
            .map(
              (option) =>
                `<button data-index="${index}" data-option="${option}">${option}</button>`
            )
            .join("")}
        </div>
        <div class="explanation" id="explanation-${index}">${
          item.explanation
        }</div>
      `;
        quizContainer.appendChild(div);
      });

      document.querySelectorAll(".options button").forEach((button) => {
        button.addEventListener("click", (e) => {
          const index = e.target.getAttribute("data-index");
          const selected = e.target.getAttribute("data-option");
          const isCorrect = quizData[index].correct === selected;
          const explanation = document.getElementById(`explanation-${index}`);

          if (isCorrect) {
            explanation.style.display = "block";
            e.target.style.backgroundColor = "#c8e6c9";
          } else {
            e.target.style.backgroundColor = "#ffcdd2";
          }
        });
      });
    </script>
  </body>
</html>
